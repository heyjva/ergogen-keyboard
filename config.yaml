meta:
  engine: 4.1.0 # Minimum Ergogen version required for KiCad 8 footprints
units:
  # Proxy Spacing Variables
  kx: cx
  ky: cy
  # Padding Variables
  px: kx + 4
  py: ky + 4
points:
  zones:
    main:
      # Global placement: shift the whole board so it sits at the top-left of
      # the A3 sheet working area (~15mm inset). Everything (thumb, outlines,
      # footprints) cascades from this zone, so this translates the board as a
      # rigid unit without affecting geometry or wiring.
      anchor:
        shift: [26, -87.5]
      key:
        padding: 1ky
        spread: 1kx
      columns:
        outer:
          key.column_net: P21
        pinky:
          key.stagger:
          key.column_net: P20
        ring:
          key.stagger: 6
          key.column_net: P19
        middle:
          key.stagger: 5
          key.column_net: P18
        index:
          key.stagger: -5
          key.column_net: P17
        inner:
          key.stagger: -3
          key.column_net: P16
        single:
          key:
            stagger: -10
          rows.num.skip: true
          rows.top.skip: true
          rows.bottom.skip: true
          key.column_net: P15
      rows:
        bottom:
          row_net: P14
        home:
          row_net: P13
        top:
          row_net: P12
        num:
          row_net: P11
    thumb:
      key:
        padding: 1ky
        spread: 1kx
      anchor:
        ref: main_inner_bottom
        shift: [-27,-16]
      columns:
        inner:
          key.column_net: P16
        home:
          key:
            rotate: 3
            shift: [2.2,-1.3]
            column_net: P17
        outer:
          key:
            shift: [5.5,-2.]
            column_net: P18
        oouter:
          key:
            shift: [8.5,-2.5]
            column_net: P19
      rows:
        cluster:
          splay: -13
          row_net: P2
outlines:
  raw:
    - what: rectangle
      where: true
      bound: true
      size: [px, py]
  keys:
    - what: rectangle
      where: true
      bound: false
      size: [kx-0.5,ky-0.5]
  board:
    - what: polygon
      operation: stack
      points:
        - ref: main_outer_num
          shift: [-0.5px,0.5py]
        - ref: main_pinky_num
          shift: [-0.5px,0.5py]
        - ref: main_ring_num
          shift: [-0.5px,0.5py]
        - ref: main_middle_num
          shift: [-0.5px,0.5py]
        - ref: main_middle_num
          shift: [0.5px,0.5py]
        - ref: main_index_num
          shift: [0.5px,0.5py]
        - ref: main_inner_num
          shift: [0.5px,0.5py]
        - ref: main_inner_num
          shift: [1.8px,0.5py]
        - ref: main_single_home
          shift: [1px,0.5py]
        - ref: main_single_home
          shift: [1px,-0.5py]
        - ref: thumb_oouter_cluster
          shift: [0.5px,0.5py]
        - ref: thumb_oouter_cluster
          shift: [0.5px,-0.5py]
        - ref: thumb_oouter_cluster
          shift: [-0.5px,-0.5py]
        - ref: thumb_outer_cluster
          shift: [-0.5px,-0.5py]
        - ref: thumb_home_cluster
          shift: [-0.5px,-0.5py]
        - ref: thumb_inner_cluster
          shift: [-0.5px,-0.5py]
        - ref: main_outer_bottom
          shift: [-0.5px,-0.5py]
      fillet: 5
  combo:
    - name: board
    - operation: subtract
      name: keys
pcbs:
  main:
    template: kicad8 # Required: ceoloide footprints are KiCad 8 only
    outlines:
      main:
        outline: board
    footprints:
      # ---- Switches: Kailh Choc v1/v2, hotswap, single-side (Back) ----
      choc_hotswap:
        what: ceoloide/switch_choc_v1_v2
        where: true
        params:
          side: B
          reversible: false
          hotswap: true
          solder: false
          include_keycap: true
          from: "{{column_net}}"
          to: "{{colrow}}"
          switch_3dmodel_filename: "${KIPRJMOD}/3d_models/Choc_V1_Switch.step"
          switch_3dmodel_xyz_rotation: [0, 180, 0]
          switch_3dmodel_xyz_offset: [0, 0, -1.6]
          hotswap_3dmodel_filename: "${KIPRJMOD}/3d_models/Choc_V1_Hotswap.step"
          hotswap_3dmodel_xyz_rotation: [0, 180, 0]
          hotswap_3dmodel_xyz_offset: [0, 0, -1.6]
          keycap_3dmodel_filename: "${KIPRJMOD}/3d_models/Choc_V1_Keycap_MBK_Black_1u.step"
          keycap_3dmodel_xyz_rotation: [0, 180, 0]
          keycap_3dmodel_xyz_offset: [0, 0, -8.2]
      # ---- Per-key diodes: THT/SMD SOD-123, single-side (Back) ----
      diode:
        what: ceoloide/diode_tht_sod123
        where: true
        params:
          side: B
          reversible: false
          include_tht: false
          from: "{{colrow}}"
          to: "{{row_net}}"
          diode_3dmodel_filename: "${KIPRJMOD}/3d_models/Diode_1N4148W.step"
          diode_3dmodel_xyz_rotation: [-90, 180, 180]
          diode_3dmodel_xyz_offset: [0, 0, -2.3]
        adjust:
          shift: [0, -5]
      # ---- nice!nano MCU, single-side (Back) ----
      # NOTE: The param name is the PHYSICAL nice!nano pin; the value is the
      # logical NET assigned to that pin. The nice!nano does not break out
      # pins named P11/P12/P13/P17, so those matrix nets are routed onto the
      # spare physical pins P5/P6/P7/P4 respectively.
      # Update your firmware pin map to match these physical pins.
      nicenano:
        what: ceoloide/mcu_nice_nano
        where:
          ref: main_single_home
          shift: [0.25px,1.8py]
          rotate: 0
        params:
          side: B
          reversible: false
          # Columns (already-matching physical pins)
          P21: P21
          P20: P20
          P19: P19
          P18: P18
          P16: P16
          P15: P15
          # Rows / phantom column remapped to spare physical pins
          P4: P17   # index column
          P14: P14  # bottom row
          P5: P13   # home row
          P6: P12   # top row
          P7: P11   # num row
          P2: P2    # thumb cluster row
          # Rotary encoder signal (EVQWGD001) on free pins
          P0: ENC1_A
          P1: ENC1_C
          mcu_3dmodel_filename: "${KIPRJMOD}/3d_models/Nice_Nano_V2.step"
          mcu_3dmodel_xyz_rotation: [0, 180, 0]
          mcu_3dmodel_xyz_offset: [0, 0, -6.6]
      # ---- Rotary encoder 1 (Panasonic EVQWGD001), Back side ----
      # Placeholder position; adjust `where` (ref/shift/rotate) to taste.
      # The push-switch (pins 1 & 2) is wired into the key matrix on a free
      # intersection: column P15 (single) x row P11 (num), via node ENC1_SW.
      encoder1:
        what: ceoloide/encoder_evqwgd001
        where:
          ref: main_single_home
          shift: [0.3px, -0.87px]
          rotate: 0
        params:
          side: B
          reversible: false
          include_edge_cuts: false   # mid-board placement: no board-edge roller slot
          A: ENC1_A
          B: GND
          C: ENC1_C
          D: GND
          from: P15       # column net (switch pin 1)
          to: ENC1_SW     # unique matrix node (switch pin 2)
      # Diode for encoder 1 push-switch: ENC1_SW -> P11 (num row)
      encoder1_diode:
        what: ceoloide/diode_tht_sod123
        where:
          ref: main_single_home
          shift: [0.15px, -.87px]
          rotate: 0
        params:
          side: B
          reversible: false
          include_tht: false
          from: ENC1_SW
          to: P11
          diode_3dmodel_filename: "${KIPRJMOD}/3d_models/Diode_1N4148W.step"
          diode_3dmodel_xyz_rotation: [-90, 180, 180]
          diode_3dmodel_xyz_offset: [0, 0, -2.3]
        adjust:
          shift: [4, -5]
      # ---- Battery connector (JST-PH 2-pin), Back side ----
      # BAT_P -> power switch -> RAW; BAT_N -> GND. Place near the MCU.
      battery:
        what: ceoloide/battery_connector_jst_ph_2
        where:
          ref: main_single_home
          shift: [-0.17px, 0.73py]
          rotate: 90
        params:
          side: B
          reversible: false
          BAT_P: BAT_P
          BAT_N: GND
      # ---- Power switch (SMD side-actuated), Back side ----
      # Switches battery positive (BAT_P) to the nice!nano RAW pin.
      power_switch:
        what: ceoloide/power_switch_smd_side
        where:
          ref: main_single_home
          shift: [0.9px,0py]
          rotate: 0
        params:
          side: B
          reversible: false
          from: BAT_P
          to: RAW
          switch_3dmodel_filename: "${KIPRJMOD}/3d_models/Switch_Power.step"
          switch_3dmodel_xyz_rotation: [90, 0, 90]
          switch_3dmodel_xyz_offset: [0, 0, -1.6]
      # ---- Reset button (Panasonic EVQ-PUC02K, SMD side-operated), Back side ----
      # Connects RST -> GND; does not use a GPIO.
      reset:
        what: ceoloide/reset_switch_smd_side
        where:
          ref: main_single_home
          shift: [.9px, 0.65py]
          rotate: -90
        params:
          side: B
          reversible: false
          from: GND
          to: RST
          reset_switch_3dmodel_filename: "${KIPRJMOD}/3d_models/Switch_Reset.step"
          reset_switch_3dmodel_xyz_rotation: [90, 0, 90]
          reset_switch_3dmodel_xyz_offset: [0, 0, -1.6]
      # ---- Mounting holes (M2, plated) at board corners ----
      mounting_hole_tl:
        what: ceoloide/mounting_hole_plated
        where:
          ref: main_outer_num
          shift: [0.41px, -0.38py]
          rotate: 0
        params:
          side: B
      mounting_hole_tr:
        what: ceoloide/mounting_hole_plated
        where:
          ref: main_inner_num
          shift: [-1.1px, 0.7py]
          rotate: 0
        params:
          side: B
      mounting_hole_tr2:
        what: ceoloide/mounting_hole_plated
        where:
          ref: main_inner_num
          shift: [0.54px, -0.35py]
          rotate: 0
        params:
          side: B
      mounting_hole_bl:
        what: ceoloide/mounting_hole_plated
        where:
          ref: main_outer_bottom
          shift: [0.41px, -0.48py]
          rotate: 0
        params:
          side: B
      mounting_hole_md:
        what: ceoloide/mounting_hole_plated
        where:
          ref: main_single_home
          shift: [-2.2px, -0.5py]
          rotate: 0
        params:
          side: B
      mounting_hole_br:
        what: ceoloide/mounting_hole_plated
        where:
          ref: main_single_home
          shift: [0.3px, -1.8py]
          rotate: 0
        params:
          side: B
