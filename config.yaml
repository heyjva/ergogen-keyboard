meta:
  engine: 4.1.0 # Minimum Ergogen version required for KiCad 8 footprints
units:
  # Proxy Spacing Variables
  kx: cx
  ky: cy
  # Padding Variables
  px: kx + 4
  py: ky + 4
points:
  zones:
    main:
      key:
        padding: 1ky
        spread: 1kx
      columns:
        outer:
          key.column_net: P21
        pinky:
          key.stagger:
          key.column_net: P20
        ring:
          key.stagger: 6
          key.column_net: P19
        middle:
          key.stagger: 5
          key.column_net: P18
        index:
          key.stagger: -5
          key.column_net: P17
        inner:
          key.stagger: -3
          key.column_net: P16
        single:
          key:
            stagger: -9
          rows.num.skip: true
          rows.top.skip: true
          rows.bottom.skip: true
          key.column_net: P15
      rows:
        bottom:
          row_net: P14
        home:
          row_net: P13
        top:
          row_net: P12
        num:
          row_net: P11
    thumb:
      key:
        padding: 1ky
        spread: 1kx
      anchor:
        ref: main_inner_bottom
        shift: [-27,-16]
      columns:
        inner:
        home:
          key:
            rotate: 3
            shift: [2.2,-1.3]
        outer:
          key:
            shift: [5.5,-2.]
        oouter:
          key:
            shift: [8.5,-2.5]
      rows:
        cluster:
          splay: -13
outlines:
  raw:
    - what: rectangle
      where: true
      bound: true
      size: [px, py]
  keys:
    - what: rectangle
      where: true
      bound: false
      size: [kx-0.5,ky-0.5]
  board:
    - what: polygon
      operation: stack
      points:
        - ref: main_outer_num
          shift: [-0.5px,0.5py]
        - ref: main_pinky_num
          shift: [-0.5px,0.5py]
        - ref: main_ring_num
          shift: [-0.5px,0.5py]
        - ref: main_middle_num
          shift: [-0.5px,0.5py]
        - ref: main_middle_num
          shift: [0.5px,0.5py]
        - ref: main_index_num
          shift: [0.5px,0.5py]
        - ref: main_inner_num
          shift: [0.5px,0.5py]
        - ref: main_inner_num
          shift: [1.8px,0.5py]
        - ref: main_single_home
          shift: [1px,0.5py]
        - ref: main_single_home
          shift: [1px,-0.5py]
        - ref: thumb_oouter_cluster
          shift: [0.5px,0.5py]
        - ref: thumb_oouter_cluster
          shift: [0.5px,-0.5py]
        - ref: thumb_oouter_cluster
          shift: [-0.5px,-0.5py]
        - ref: thumb_outer_cluster
          shift: [-0.5px,-0.5py]
        - ref: thumb_home_cluster
          shift: [-0.5px,-0.5py]
        - ref: thumb_inner_cluster
          shift: [-0.5px,-0.5py]
        - ref: main_outer_bottom
          shift: [-0.5px,-0.5py]
      fillet: 5
  combo:
    - name: board
    - operation: subtract
      name: keys
pcbs:
  main:
    template: kicad8 # Required: ceoloide footprints are KiCad 8 only
    outlines:
      main:
        outline: board
    footprints:
      # ---- Switches: Kailh Choc v1/v2, hotswap, single-side (Back) ----
      choc_hotswap:
        what: ceoloide/switch_choc_v1_v2
        where: true
        params:
          side: B
          reversible: false
          hotswap: true
          solder: false
          include_keycap: true
          from: "{{column_net}}"
          to: "{{colrow}}"
      # ---- Per-key diodes: THT/SMD SOD-123, single-side (Back) ----
      diode:
        what: ceoloide/diode_tht_sod123
        where: true
        params:
          side: B
          reversible: false
          include_tht: true
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, -5]
      # ---- nice!view display, single-side (Back) ----
      niceview:
        what: ceoloide/display_nice_view
        where:
          ref: main_single_home
          shift: [0px,1.5py]
          rotate: 0
        params:
          side: B
          reversible: false
          include_labels: true
          invert_jumpers_position: false
          MOSI: MOSI
          SCK: SCK
          VCC: VCC
          GND: GND
          CS: CS
      # ---- nice!nano MCU, single-side (Back) ----
      # NOTE: The param name is the PHYSICAL nice!nano pin; the value is the
      # logical NET assigned to that pin. The nice!nano does not break out
      # pins named P11/P12/P13/P17, so those matrix nets are routed onto the
      # spare physical pins P5/P6/P7/P4 respectively. The three SPI signals
      # for the nice!view (MOSI/SCK/CS) are assigned to P8/P9/P3.
      # Update your firmware pin map to match these physical pins.
      nicenano:
        what: ceoloide/mcu_nice_nano
        where:
          ref: main_single_home
          shift: [0.25px,1.7py]
          rotate: 0
        params:
          side: B
          reversible: false
          # Columns (already-matching physical pins)
          P21: P21
          P20: P20
          P19: P19
          P18: P18
          P16: P16
          P15: P15
          # Rows / phantom column remapped to spare physical pins
          P4: P17   # index column
          P14: P14  # bottom row
          P5: P13   # home row
          P6: P12   # top row
          P7: P11   # num row
          # nice!view SPI signals
          P8: MOSI
          P9: SCK
          P3: CS
